<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>泰國新廠設備追蹤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky app bar → summary tiles + department progress → filter bar → list or Gantt; editor is a right-side drawer (full screen on phones) */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --sunk:#E9EDF1; --ink:#15202B; --muted:#5A6672; --line:#D9DFE5;
  --accent:#1C5D99; --accent-ink:#FFFFFF; --accent-soft:#E2ECF6; --po:#9DBBDD;
  --ok:#1F7A4D; --ok-soft:#DFF1E7; --warn:#9A5A00; --warn-soft:#FAEED8; --tune:#E3A34A;
  --bad:#B42318; --bad-soft:#FBE3E0; --scrim:rgba(15,25,35,.42); --shadow:0 12px 40px rgba(15,30,45,.18);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:8px; --gut:max(16px, env(safe-area-inset-left, 0px)); --gutR:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#161F28; --sunk:#1C2731; --ink:#E4EAF0; --muted:#97A4B0; --line:#2A3641;
  --accent:#6EA6DB; --accent-ink:#0B1A28; --accent-soft:#1A2C3E; --po:#35577A;
  --ok:#5BC489; --ok-soft:#14301F; --warn:#E6A84F; --warn-soft:#33260F; --tune:#C98B34;
  --bad:#F07A6C; --bad-soft:#3A1A17; --scrim:rgba(0,0,0,.6); --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161F28; --sunk:#1C2731; --ink:#E4EAF0; --muted:#97A4B0; --line:#2A3641;
  --accent:#6EA6DB; --accent-ink:#0B1A28; --accent-soft:#1A2C3E; --po:#35577A;
  --ok:#5BC489; --ok-soft:#14301F; --warn:#E6A84F; --warn-soft:#33260F; --tune:#C98B34;
  --bad:#F07A6C; --bad-soft:#3A1A17; --scrim:rgba(0,0,0,.6); --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1360px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gutR)}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px}
.inp{width:100%;min-height:38px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{min-height:76px;resize:vertical}
select.inp{appearance:auto}
label.lab{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-size:17px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:12px;color:var(--muted)}
.bar-actions{display:flex;gap:8px;align-items:center}
.demo-band{background:var(--warn-soft);color:var(--warn);font-size:13px}
.demo-band .wrap{padding-block:8px}

/* summary */
main{display:flex;flex-direction:column;gap:16px;padding-block:16px 48px}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left}
.tile:hover{border-color:var(--accent)}
.tile.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tile small{font-size:12px;color:var(--muted)}
.tile strong{font:500 26px/1.15 var(--mono);font-variant-numeric:tabular-nums}
.tile.t-done strong{color:var(--ok)} .tile.t-bad strong{color:var(--bad)} .tile.t-doing strong{color:var(--accent)} .tile.t-soon strong{color:var(--warn)}
.overall{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:13px;color:var(--muted)}
.overall .meter{flex:1 1 240px}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:4px}
.links{display:flex;gap:14px;flex-wrap:wrap}

.depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.dept{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.dept.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dept .top{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.dept .top span{font:400 12px var(--mono);color:var(--muted)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .search{flex:1 1 240px}
.filters select{width:auto;min-width:120px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:0 14px;min-height:36px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.count{font-size:13px;color:var(--muted);margin-left:auto}

/* list */
.list{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow-x:auto}
.row{display:grid;grid-template-columns:62px 84px minmax(200px,2.4fr) minmax(120px,1.2fr) minmax(110px,1.1fr) 70px 130px 120px 44px;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);min-width:1000px;cursor:pointer}
.row:hover{background:var(--accent-soft)}
.row.head{cursor:default;border-top:0;background:var(--sunk);font-size:12px;color:var(--muted);letter-spacing:.03em;padding-block:8px}
.row.head:hover{background:var(--sunk)}
.sh{border:0;background:transparent;font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer;padding:2px 0;display:inline-flex;align-items:center;gap:4px;text-align:left;border-radius:4px}
.sh:hover{color:var(--accent)}
.sh i{font-style:normal;font-size:10px;opacity:0}
.sh:hover i{opacity:.5}
.sh.on{color:var(--ink);font-weight:700}
.sh.on i{opacity:1;color:var(--accent)}
.row.head .c-qty{justify-self:end}
.row.head .c-files{justify-self:center}
.mscrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.modal{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 24px));max-height:calc(100% - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;background:var(--surface);border-radius:12px;box-shadow:var(--shadow)}
.m-body{overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.modal h2{margin:0;font-size:18px;text-wrap:balance}
.modal h3{margin:8px 0 0;font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.04em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal p{margin:0;color:var(--muted)}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.ck:hover{border-color:var(--accent)}
.ck input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--accent)}
.ck .cb{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.ck small{color:var(--muted)}
.ck s{color:var(--muted)}
.m-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.c-name{display:flex;flex-direction:column;min-width:0}
.c-name b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-name small,.c-sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-dept,.c-vendor{min-width:0;display:flex;flex-direction:column}
.c-dept span,.c-vendor span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-qty{text-align:right}
.c-files{text-align:center;color:var(--muted);font-size:13px}
.c-id{font-size:12px;color:var(--muted)}
.c-prog{display:flex;align-items:center;gap:8px}
.c-prog .meter{flex:1}
.c-prog span{font:12px var(--mono);color:var(--muted);min-width:34px;text-align:right}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.s-todo{background:var(--sunk);color:var(--muted)}
.chip.s-doing{background:var(--accent-soft);color:var(--accent)}
.chip.s-done{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.t-bad{color:var(--bad)} .t-ok{color:var(--ok)} .t-warn{color:var(--warn)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
mark{background:var(--warn-soft);color:inherit;border-radius:2px;padding:0 1px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.search-hint{font-size:12px;color:var(--muted)}

/* Gantt */
.gantt-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.gantt{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:auto;max-height:72vh;position:relative}
.g-grid{position:relative;width:calc(var(--gname) + var(--gw))}
.g-row{display:flex}
.g-row.g-hrow{position:sticky;top:0;z-index:3}
.g-cell{height:34px;border-bottom:1px solid var(--line)}
.g-name{flex:none;width:var(--gname);position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;padding:0 10px;min-width:0;cursor:pointer}
.g-name b{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-name small{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-name:hover b{color:var(--accent)}
.g-head{background:var(--sunk);height:46px}
.g-head.g-name{z-index:4;background:var(--sunk);cursor:default;font-size:12px;color:var(--muted)}
.g-track{flex:none;width:var(--gw);position:relative;overflow:hidden}
.g-tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11px;color:var(--muted);padding-left:4px;white-space:nowrap}
.g-tick.m{border-left-color:var(--muted);font-weight:500;color:var(--ink)}
.g-head .g-tick{top:auto;height:20px;bottom:0}
.g-head .g-month{position:absolute;top:4px;font-size:12px;font-weight:500;padding-left:4px;white-space:nowrap}
.g-wk{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);opacity:.8;z-index:1;pointer-events:none}
.g-bar{position:absolute;height:12px;border-radius:3px;cursor:pointer;min-width:4px}
.g-bar.po{top:6px;background:var(--po)}
.g-bar.tune{top:16px;background:var(--tune)}
.g-dot{position:absolute;top:6px;width:12px;height:12px;transform:translateX(-6px) rotate(45deg);border-radius:2px;cursor:pointer}
.g-dot.eta{background:var(--accent)}
.g-dot.arr{background:var(--ok)}
.g-dot.late{background:var(--bad)}
.g-note{font-size:12px;color:var(--muted)}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
.d-head{display:flex;gap:10px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.d-head .t{flex:1;min-width:0}
.d-head h2{margin:0;font-size:18px;line-height:1.3;text-wrap:balance;overflow-wrap:anywhere}
.d-head .sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--muted)}
.d-body{flex:1;overflow:auto;padding:16px 18px 24px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sec h3{margin:0 0 12px;font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fgrid .wide{grid-column:span 3}
.fgrid .half{grid-column:span 2}
.d-foot{display:flex;gap:8px;align-items:center;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.d-foot .sp{flex:1}
.d-foot .state{font-size:12px;color:var(--muted)}
.d-foot .state.dirty{color:var(--warn)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;padding:10px 12px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn)}
.confirm span{flex:1;min-width:160px}

/* todos */
.todos{display:flex;flex-direction:column}
.todo{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line)}
.todo:first-child{border-top:0}
.todo input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);flex:none;cursor:pointer}
.todo .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.todo.done .tx{color:var(--muted);text-decoration:line-through}
.todo .at{font:12px var(--mono);color:var(--muted)}
.todo .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:4px}
.todo .x:hover{color:var(--bad);background:var(--bad-soft)}
.todo .grip{cursor:grab;color:var(--muted);font-size:14px;line-height:1;padding:4px 2px;user-select:none;touch-action:none}
.todo .mv{border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;width:28px;height:28px;border-radius:6px;font-size:13px;line-height:1;flex:none}
.todo .mv:hover:not(:disabled){border-color:var(--line);color:var(--accent);background:var(--accent-soft)}
.todo .mv:disabled{opacity:.25;cursor:default}
.todo.dragging{opacity:.4}
.todo .tb{flex:1;min-width:0;display:flex;flex-direction:column}
.todo .tb .tx{flex:none}
.tnote{font-size:13px;color:var(--warn);overflow-wrap:anywhere;cursor:pointer}
.todo.done .tnote{color:var(--muted)}
.todo .ed{border:0;background:transparent;color:var(--muted);cursor:pointer;height:28px;padding:0 6px;border-radius:6px;font-size:12px;white-space:nowrap;flex:none}
.todo .ed:hover,.todo .ed.has{color:var(--warn)}
.todo .ed:hover{background:var(--warn-soft)}
.tnote-edit{display:flex;gap:8px;padding:0 0 10px 30px;flex-wrap:wrap}
.tnote-edit .inp{flex:1 1 200px}
.c-flag{font-size:12px;color:var(--warn);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* vendor contacts */
.vbox{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:10px}
.vbox-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.contacts{display:flex;flex-direction:column;gap:8px}
.contact{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:var(--r);background:var(--sunk)}
.contact .who{font-weight:500}
.contact .who span{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.cl{display:flex;gap:8px;align-items:center;font-size:13px;min-width:0;flex-wrap:wrap}
.cl em{font-style:normal;color:var(--muted);font-size:12px;min-width:56px}
.cl a,.cl span{overflow-wrap:anywhere}
.cp{border:1px solid var(--line);background:var(--surface);border-radius:4px;font-size:11px;padding:1px 6px;cursor:pointer;color:var(--muted)}
.cp:hover{color:var(--accent);border-color:var(--accent)}
.vnote{font-size:13px;white-space:pre-wrap;color:var(--muted)}
.cedit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);position:relative}
.cedit .rm{position:absolute;top:6px;right:6px}
.cedit .full{grid-column:span 2}
.vactions{display:flex;gap:8px;flex-wrap:wrap}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.vcard{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
.vcard-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.vcard-h b{font-size:15px;overflow-wrap:anywhere}
.vcard-h small{color:var(--muted);font-size:12px;white-space:nowrap}
.vitems{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vlist{display:flex;flex-direction:column}
.vlist button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:9px 2px;cursor:pointer}
.vlist button:first-child{border-top:0}
.vlist button:hover b{color:var(--accent)}
@media (max-width:720px){ .vgrid{grid-template-columns:1fr} .cedit{grid-template-columns:1fr} .cedit .full{grid-column:auto} .tnote-edit{padding-left:0} }
.todo.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.todo.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
@media (max-width:720px){ .todo .grip{display:none} .todo .mv{width:34px;height:34px;font-size:15px} }
.addrow{display:flex;gap:8px;margin-top:10px}

/* files */
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px;border:1.5px dashed var(--line);border-radius:var(--r);text-align:center;cursor:pointer;color:var(--muted)}
.drop b{color:var(--accent);font-weight:500}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.files{display:flex;flex-direction:column;margin-top:10px}
.file{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.file:first-child{border-top:0}
.file .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.file .nm a,.file .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file small{font:12px var(--mono);color:var(--muted)}
.file.up .nm span::after{content:" · 上傳中…";color:var(--warn)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px var(--gutR) 24px var(--gut)}
.card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.card h1{margin:0;font-size:22px}
.card p{margin:0;color:var(--muted)}
.note{padding:10px 12px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:13px}
.err{color:var(--bad);font-size:13px;min-height:1em}
.loading{min-height:60vh;display:grid;place-items:center;text-align:center;color:var(--muted)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .spin{animation-duration:3s} }

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}

/* phones & tablets */
@media (max-width: 900px){
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width: 720px){
  body{font-size:15px}
  .inp,select.inp,textarea.inp{font-size:16px}
  .brand b{font-size:16px}
  .bar-actions .hide-sm{display:none}
  .tiles{gap:8px}
  .tile{padding:10px}
  .tile strong{font-size:22px}
  .depts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters .search{flex-basis:100%}
  .filters select{flex:1 1 calc(50% - 4px);min-width:0}
  .filters .seg{flex:1 1 100%}
  .filters .seg button{flex:1}
  .count{margin-left:0;width:100%}
  .list{border:0;background:transparent;overflow:visible;display:flex;flex-direction:column;gap:8px}
  .row.head{display:none}
  .row{min-width:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);gap:6px 10px;padding:12px;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;
    grid-template-areas:"name name st" "dept vendor vendor" "eta eta qty" "prog prog files"}
  .c-id{display:none}
  .c-st{grid-area:st;justify-self:end}
  .c-name{grid-area:name}
  .c-name b{white-space:normal}
  .c-dept{grid-area:dept}.c-vendor{grid-area:vendor}.c-eta{grid-area:eta}.c-qty{grid-area:qty}.c-prog{grid-area:prog}.c-files{grid-area:files}
  .c-dept,.c-vendor,.c-eta{font-size:13px}
  .c-vendor::before{content:"廠商 ";color:var(--muted);font-size:12px}
  .c-eta::before{content:"預計交機 ";color:var(--muted);font-size:12px}
  .c-qty::before{content:"數量 ";color:var(--muted);font-size:12px;font-family:var(--sans)}
  .c-files::before{content:"附件 "}
  .drawer{width:100%;padding-left:env(safe-area-inset-left,0px)}
  .d-head,.d-body,.d-foot{padding-left:16px;padding-right:16px}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid .wide,.fgrid .half{grid-column:span 2}
  .gantt{max-height:none}
}

(function(){

const FORM=[
 {sec:'基本資料',f:[['name','設備名稱','text','wide',1],['nameEn','英文名稱','text','wide'],['dept','部門','combo','',0,DEPTS],['area','製程 / 站別','text'],['tagNo','機台編號','text'],['spec','規格 / 型號','text','wide'],['qty','數量','num'],['unit','單位','text'],['owner','負責人','text']]},

];

const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const pd=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null};

const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- 模糊搜尋：簡繁通用、忽略大小寫與符號、可打部分字或打錯一兩個字 ---------- */
const S2T={"干":"幹","亚":"亞","布":"佈","来":"來","仓":"倉","个":"個","备":"備","价":"價","仪":"儀","储":"儲","内":"內","两":"兩","剥":"剝","划":"劃","剂":"劑","动":"動","务":"務","区":"區","协":"協","却":"卻","参":"參","单":"單","喷":"噴","吨":"噸","国":"國","围":"圍","圆":"圓","图":"圖","尧":"堯","报":"報","场":"場","块":"塊","涂":"塗","尘":"塵","压":"壓","奥":"奧","学":"學","实":"實","审":"審","宽":"寬","宝":"寶","导":"導","层":"層","带":"帶","库":"庫","厂":"廠","废":"廢","广":"廣","强":"強","弯":"彎","后":"後","径":"徑","恒":"恆","扫":"掃","采":"採","换":"換","损":"損","击":"擊","摆":"擺","搅":"攪","数":"數","暂":"暫","东":"東","条":"條","弃":"棄","栈":"棧","枫":"楓","极":"極","荣":"榮","标":"標","机":"機","检":"檢","柜":"櫃","权":"權","欧":"歐","气":"氣","净":"淨","涡":"渦","测":"測","准":"準","温":"溫","湿":"濕","滚":"滾","为":"為","无":"無","荧":"熒","热":"熱","灯":"燈","炉":"爐","独":"獨","现":"現","玛":"瑪","环":"環","产":"產","叠":"疊","发":"發","盘":"盤","硕":"碩","确":"確","码":"碼","砺":"礪","税":"稅","称":"稱","节":"節","范":"範","笃":"篤","筛":"篩","篮":"籃","签":"籤","红":"紅","纳":"納","纯":"純","纸":"紙","扎":"紮","细":"細","组":"組","绝":"絕","统":"統","丝":"絲","网":"網","线":"線","缘":"緣","总":"總","绕":"繞","圣":"聖","声":"聲","脉":"脈","脑":"腦","脚":"腳","胶":"膠","兴":"興","华":"華","莱":"萊","万":"萬","盖":"蓋","蓝":"藍","苏":"蘇","处":"處","号":"號","术":"術","冲":"衝","补":"補","装":"裝","制":"製","规":"規","视":"視","观":"觀","计":"計","讨":"討","记":"記","设":"設","询":"詢","试":"試","详":"詳","认":"認","误":"誤","调":"調","请":"請","论":"論","谱":"譜","议":"議","护":"護","丰":"豐","贝":"貝","货":"貨","买":"買","贴":"貼","贸":"貿","购":"購","赛":"賽","车":"車","轴":"軸","载":"載","辆":"輛","辉":"輝","轮":"輪","输":"輸","转":"轉","办":"辦","连":"連","周":"週","进":"進","游":"遊","运":"運","达":"達","迈":"邁","乡":"鄉","释":"釋","钉":"釘","针":"針","钳":"鉗","银":"銀","铜":"銅","锐":"銳","锉":"銼","铝":"鋁","锆":"鋯","锂":"鋰","锯":"鋸","钢":"鋼","录":"錄","锤":"錘","钱":"錢","锡":"錫","错":"錯","表":"錶","镀":"鍍","链":"鏈","镜":"鏡","锈":"鏽","铁":"鐵","鉴":"鑑","镊":"鑷","钻":"鑽","长":"長","门":"門","开":"開","间":"間","阀":"閥","关":"關","阳":"陽","双":"雙","离":"離","电":"電","雾":"霧","韦":"韋","顶":"頂","顺":"順","头":"頭","频":"頻","颗":"顆","额":"額","类":"類","显":"顯","风":"風","飞":"飛","腾":"騰","验":"驗","体":"體","鸿":"鴻","盐":"鹽","点":"點"};
const ALIAS={'稱':'秤','錶':'表','銲':'焊','臺':'台','製':'制'};
const SKIP=/[\s\-_/\\()（）\[\]【】{},，.。、:：;；*×'"“”‘’|+~!！?？&]/;
function nch(ch){ let c=ch.normalize('NFKC').toLowerCase(); c=S2T[c]||c; return ALIAS[c]||c; }
function norm(s){ let o=''; for(const ch of String(s==null?'':s)){ const c=nch(ch); if(!SKIP.test(c)) o+=c; } return o; }
function subseq(t,s){ let i=0; for(const c of s){ if(c===t[i]) i++; if(i===t.length) return true; } return false; }
function approx(t,s,k){ // 允許 k 個字打錯／多打／少打
  let prev=new Array(t.length+1).fill(0).map((_,i)=>i);
  for(const c of s){ const cur=[0]; for(let i=1;i<=t.length;i++) cur[i]=Math.min(prev[i]+1,cur[i-1]+1,prev[i-1]+(t[i-1]===c?0:1)); if(cur[t.length]<=k) return true; prev=cur; }
  return prev[t.length]<=k;
}
function termScore(t,nm,all){
  if(nm.includes(t)) return nm.startsWith(t)?120:100;
  if(all.includes(t)) return 60;
  const asc=/^[\x00-\x7f]+$/.test(t), minA=asc?5:3; // 英數字太短時不做打錯容錯，避免誤判
  if(!asc&&t.length>=2&&subseq(t,nm)) return 45;
  if(t.length>=minA&&approx(t,nm,t.length>=(asc?8:6)?2:1)) return 40;
  if(t.length>=minA+1&&approx(t,all,t.length>=(asc?9:7)?2:1)) return 30;
  if(!asc&&t.length>=2&&[...t].every(c=>nm.includes(c))) return 30;
  if(!asc&&t.length>=2&&[...t].every(c=>all.includes(c))) return 12;
  return 0;
}
function searchTerms(q){ return String(q||'').split(/[\s,，、]+/).map(norm).filter(Boolean); }
function scoreItem(it,terms){
  const nm=norm([it.name,it.nameEn].join(' ')), all=norm([it.id,it.name,it.nameEn,it.spec,it.vendor,it.area,it.dept,it.tagNo,it.owner,it.note,it.source,it.origin,it.power,it.water,it.air,it.gas,it.drain,it.exhaust,(it.todos||[]).map(t=>t.note||'').join(' '),vendorText(it.vendor)].join(' '));
  let sum=0; for(const t of terms){ const v=termScore(t,nm,all); if(!v) return 0; sum+=v; } return sum/terms.length;
}
function hl(text,q){
  const terms=searchTerms(q); if(!terms.length) return esc(text);
  const set=new Set(terms.join('').split('').filter(c=>c>'⹿'));
  const ascii=terms.filter(t=>/^[\x00-\x7f]{2,}$/.test(t));
  let out=[...String(text||'')].map(ch=>({ch,on:set.has(nch(ch))}));
  if(ascii.length){ const low=String(text||'').toLowerCase(); ascii.forEach(a=>{ let i=low.indexOf(a); while(i>=0){ for(let j=i;j<i+a.length&&j<out.length;j++) out[j].on=true; i=low.indexOf(a,i+1);} }); }
  return out.map(o=>o.on?`<mark>${esc(o.ch)}</mark>`:esc(o.ch)).join('').replace(/<\/mark><mark>/g,'');
}
function suggest(q,n){
  let cs=[...new Set(norm(q).split(''))]; const cjk=cs.filter(c=>c>'\u2e7f'); if(cjk.length) cs=cjk; if(!cs.length) return [];
  return S.items.map(it=>{const nm=norm(it.name+it.spec); return {it,v:cs.filter(c=>nm.includes(c)).length/cs.length};}).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,n).map(x=>x.it);
}
const fsize=b=>!b?'':b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(1)+' MB';
const folderUrl=id=>id?'https://drive.google.com/drive/folders/'+id:'';

/* ---------- backend bridge ---------- */
const GAS=typeof google==='object'&&google&&google.script&&google.script.run;
const API_URL=String(window.API_URL||'').trim();
const DEMO=!GAS&&!API_URL&&Array.isArray(window.SEED_ITEMS);
async function call(fn,...a){
  if(GAS) return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a));
  if(API_URL){
    let r;
    try{ r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args:a}),redirect:'follow'}); }
    catch(e){ throw new Error('連不到伺服器，請檢查網路後再試一次。'); }
    let j; try{ j=await r.json(); }catch(e){ throw new Error('伺服器回應異常（HTTP '+r.status+'）。請確認 Apps Script 部署的存取權是「所有人」。'); }
    if(!j.ok) throw new Error(j.error||'發生錯誤');
    return j.data;
  }
  if(DEMO) return new Promise((res,rej)=>setTimeout(()=>{try{res(Demo[fn](...a))}catch(e){rej(e)}},120));
  throw new Error('NOAPI');
}
const msg=e=>String(e&&e.message||e).replace(/^Error:\s*/,'').replace(/^Exception:\s*/,'');
async function authed(fn,...a){
  try{return await call(fn,S.token,...a)}
  catch(e){ if(msg(e).indexOf('AUTH')>=0){S.token=null;LS.del(TK);boot();throw new Error('登入已過期，請重新登入。')} throw e; }
}

/* ---------- preview backend (browser only) ---------- */
const Demo={
  mem:null,cred:null,
  hash(p){let h=7;for(const c of p)h=(h*31+c.charCodeAt(0))|0;return String(h)},
  items(){ if(this.mem) return this.mem; let v=null; try{v=JSON.parse(localStorage.getItem('eqt_demo_items')||'null')}catch(e){}
    this.mem=v||clone(window.SEED_ITEMS||[]); return this.mem; },
  persist(){LS.set('eqt_demo_items',JSON.stringify(this.mem))},
  getCred(){ if(this.cred) return this.cred; try{this.cred=JSON.parse(localStorage.getItem('eqt_demo_cred')||'null')}catch(e){} return this.cred; },
  getAuthState(){return{initialized:!!this.getCred()}},
  setupAccount(u,p){ if(this.getCred()) throw new Error('帳號已經建立過了，請直接登入。'); u=String(u||'').trim();
    if(u.length<3) throw new Error('帳號至少 3 個字元。'); if(String(p||'').length<6) throw new Error('密碼至少 6 個字元。');
    this.cred={u,p:this.hash(p)}; LS.set('eqt_demo_cred',JSON.stringify(this.cred)); return 'demo'; },
  login(u,p){ const c=this.getCred(); if(!c) throw new Error('尚未建立帳號。'); if(c.u!==String(u).trim()||c.p!==this.hash(String(p))) throw new Error('帳號或密碼錯誤。'); return 'demo'; },
  logout(){return true},
  vend(){ if(this.vmem) return this.vmem; let v=null; try{v=JSON.parse(localStorage.getItem('eqt_demo_vendors')||'null')}catch(e){} this.vmem=v||[]; return this.vmem; },
  listItems(){return{items:clone(this.items()),vendors:clone(this.vend()),meta:{demo:true}}},
  saveVendor(t,v){ const name=String(v.name||'').trim(); if(!name) throw new Error('請先填寫設備廠商名稱。'); const all=this.vend(); const d=new Date();
    const o={name,contacts:(v.contacts||[]).filter(c=>c.name||c.role||c.phone||c.chat||c.email),note:v.note||'',updatedAt:ymd(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
    const i=all.findIndex(x=>x.name===name); if(i>=0) all[i]=o; else all.push(o); LS.set('eqt_demo_vendors',JSON.stringify(all)); return clone(o); },
  saveItem(t,it){ const all=this.items(); let cur=it.id&&all.find(x=>x.id===it.id);
    if(!cur){ const max=all.reduce((m,x)=>Math.max(m,+String(x.id).replace(/\D/g,'')||0),0); cur={id:'E'+String(max+1).padStart(3,'0'),files:[],folderId:''}; all.push(cur); }
    Object.keys(it).forEach(k=>{if(!['id','files','folderId'].includes(k)) cur[k]=it[k]});
    const d=new Date(); cur.updatedAt=ymd(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes()); this.persist(); return clone(cur); },
  bulkUpdate(t,ids,fields){ const d=new Date(), now=ymd(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes()); const out=[];
    ids.forEach(id=>{ const it=this.items().find(x=>x.id===id); if(!it) return; Object.keys(fields).forEach(k=>{ if(k!=='todoOps') it[k]=fields[k]; }); if(fields.todoOps) it.todos=applyTodoOps(it.todos||[],fields.todoOps); it.updatedAt=now; out.push(clone(it)); }); this.persist(); return out; },
  exportList(){ throw new Error('預覽版不能匯出。正式版會在雲端硬碟「甘特圖匯出」資料夾產生 Excel 檔（含水電氣統計）並直接下載。'); },
  deleteItem(t,id){ this.mem=this.items().filter(x=>x.id!==id); this.persist(); return true; },
  uploadFile(t,id,name,mime,b64,size){ const it=this.items().find(x=>x.id===id); const d=new Date();
    it.files=(it.files||[]).concat([{id:'f'+Date.now(),name,url:'',size,mime,date:ymd(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())}]); this.persist(); return{files:it.files,folderId:''}; },
  deleteFile(t,id,fid){ const it=this.items().find(x=>x.id===id); it.files=(it.files||[]).filter(f=>f.id!==fid); this.persist(); return{files:it.files,folderId:''}; },
  exportGantt(){ throw new Error('預覽版不能匯出。正式版會在雲端硬碟「甘特圖匯出」資料夾產生 Excel 檔並直接下載。'); }
};

/* ---------- state ---------- */
const S={token:LS.get(TK),items:[],vendors:{},meta:{},noteEdit:null,vEdit:null,view:location.hash==='#gantt'?'gantt':location.hash==='#vendors'?'vendor':(['gantt','vendor'].includes(LS.get('eqt_view'))?LS.get('eqt_view'):'list'),
  f:{q:'',dept:'',status:'',source:''},sort:LS.get('eqt_sort')||'id',dir:+(LS.get('eqt_dir')||1),zoom:LS.get('eqt_zoom')||'week',draft:null,dirty:false,uploading:[],arm:null};

const app=$('#app');
function toast(t,bad){ const el=document.createElement('div'); el.className='toast'+(bad?' bad':''); el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),bad?5200:2600); }

/* ---------- status helpers ---------- */
function prog(it){const t=it.todos||[];return{d:t.filter(x=>x.done).length,n:t.length}}
function statusOf(it){const p=prog(it); if(p.n&&p.d===p.n) return 'done'; if(p.d>0||it.poDate||it.arrivalDate) return 'doing'; return 'todo';}
function isOverdue(it){return statusOf(it)!=='done'&&!it.arrivalDate&&it.eta&&until(it.eta)<0}
function isSoon(it){return statusOf(it)!=='done'&&!it.arrivalDate&&it.eta&&until(it.eta)>=0&&until(it.eta)<=30}
const ST_LABEL={todo:'未開始',doing:'進行中',done:'已完成'};
function chip(it){ if(isOverdue(it)) return '<span class="chip bad">逾期</span>'; const s=statusOf(it); return `<span class="chip s-${s}">${ST_LABEL[s]}</span>`; }

/* ---------- boot / auth ---------- */
async function boot(){
  if(!GAS&&!API_URL&&!DEMO){ app.innerHTML=`<div class="login"><div class="card"><h1>泰國新廠設備追蹤</h1><p>網頁還沒連上資料庫。</p><div class="note">請把 Google Apps Script 部署後得到的網址（…/exec）貼到 GitHub 上 config.js 的 API_URL，存檔後約 1 分鐘重新整理這個頁面。</div></div></div>`; return; }
  if(S.token){ return loadData(); }
  app.innerHTML='<div class="loading"><div><div class="spin"></div>連線中…</div></div>';
  let st; try{ st=await call('getAuthState'); }catch(e){ app.innerHTML=`<div class="loading">無法連線：${esc(msg(e))}</div>`; return; }
  renderLogin(st.initialized);
}
function renderLogin(init){
  app.innerHTML=`<div class="login"><form class="card" id="lf" autocomplete="on">
    <div><h1>泰國新廠設備追蹤</h1><p>${init?'請登入':'第一次使用：建立登入帳號'}</p></div>
    ${init?'':'<div class="note">這組帳號密碼建立後就固定使用，網頁上無法修改，請記下來交給需要的同事。</div>'}
    ${GAS?'':'<div class="note">預覽版：帳密只存在這台瀏覽器，用來試用登入流程。</div>'}
    <div><label class="lab" for="lu">帳號</label><input class="inp" id="lu" name="username" autocomplete="username" required></div>
    <div><label class="lab" for="lp">密碼</label><input class="inp" id="lp" type="password" name="password" autocomplete="${init?'current-password':'new-password'}" required></div>
    ${init?'':'<div><label class="lab" for="lp2">再輸入一次密碼</label><input class="inp" id="lp2" type="password" autocomplete="new-password" required></div>'}
    <div class="err" id="le"></div>
    <button class="btn primary" id="lb" type="submit">${init?'登入':'建立帳號並登入'}</button>
  </form></div>`;
  $('#lf').addEventListener('submit',async e=>{
    e.preventDefault(); const u=$('#lu').value, p=$('#lp').value, er=$('#le'), b=$('#lb'); er.textContent='';
    if(!init && p!==$('#lp2').value){ er.textContent='兩次輸入的密碼不一樣。'; return; }
    b.disabled=true; b.textContent='處理中…';
    try{ S.token=await call(init?'login':'setupAccount',u,p); LS.set(TK,S.token); loadData(); }
    catch(x){ er.textContent=msg(x); b.disabled=false; b.textContent=init?'登入':'建立帳號並登入'; }
  });
}
async function loadData(){
  app.innerHTML='<div class="loading"><div><div class="spin"></div>載入設備清單…<br><small>第一次啟動會建立試算表與雲端資料夾，約需 10–30 秒</small></div></div>';
  try{ const r=await authed('listItems'); S.items=r.items||[]; S.meta=r.meta||{}; S.vendors={}; (r.vendors||[]).forEach(v=>S.vendors[v.name]=v); renderShell(); }
  catch(e){ if(S.token) app.innerHTML=`<div class="loading"><div>載入失敗：${esc(msg(e))}<br><br><button class="btn" id="rt">重試</button></div></div>`, $('#rt')&&($('#rt').onclick=loadData); }
}
async function doLogout(){ try{await call('logout',S.token)}catch(e){} S.token=null; LS.del(TK); boot(); }

function setView(v){ S.view=v; LS.set('eqt_view',v); try{history.replaceState(null,'',v==='gantt'?'#gantt':v==='vendor'?'#vendors':location.pathname+location.search)}catch(e){}
  $('#vList').className=v==='list'?'on':''; $('#vGantt').className=v==='gantt'?'on':''; $('#vVendor').className=v==='vendor'?'on':''; renderView(); }
function deptList(){ const s=new Set(DEPTS); S.items.forEach(i=>i.dept&&s.add(i.dept)); return [...s]; }

function renderSummary(){
  const it=S.items, n=it.length;
  const c={all:n,todo:0,doing:0,done:0,overdue:0,soon:0}; let td=0,tn=0;
  it.forEach(x=>{c[statusOf(x)]++; if(isOverdue(x))c.overdue++; if(isSoon(x))c.soon++; const p=prog(x); td+=p.d; tn+=p.n;});
  const T=[['','全部設備',c.all,''],['todo','未開始',c.todo,''],['doing','進行中',c.doing,'t-doing'],['done','已完成',c.done,'t-done'],['overdue','逾期未交機',c.overdue,'t-bad'],['soon','30 天內交機',c.soon,'t-soon']];
  $('#tiles').innerHTML=T.map(([k,l,v,cl])=>`<button class="tile ${cl} ${S.f.status===k?'on':''}" data-k="${k}"><small>${l}</small><strong>${v}</strong></button>`).join('');
  $('#tiles').querySelectorAll('.tile').forEach(b=>b.onclick=()=>{S.f.status=S.f.status===b.dataset.k?'':b.dataset.k; $('#fs').value=S.f.status; renderSummary(); renderView();});
  const sums={}; it.forEach(x=>{const v=Number(x.totalPrice); if(v>0){sums[x.currency||'CNY']=(sums[x.currency||'CNY']||0)+v}});
  const pct=tn?Math.round(td/tn*100):0;
  $('#overall').innerHTML=`<span>待辦完成 <b class="mono">${td}/${tn}</b>（${pct}%）</span><div class="meter" role="img" aria-label="整體待辦完成 ${pct}%"><i style="width:${pct}%"></i></div>
    <span>預算合計 ${Object.keys(sums).map(k=>`<b class="mono">${k} ${money(sums[k])}</b>`).join(' · ')||'—'}</span>
    <span class="links">${S.meta.sheetUrl?`<a href="${esc(S.meta.sheetUrl)}" target="_blank" rel="noopener">開啟 Google 試算表</a>`:''}${S.meta.rootUrl?`<a href="${esc(S.meta.rootUrl)}" target="_blank" rel="noopener">開啟雲端資料夾</a>`:''}</span>`;
  const dm={}; it.forEach(x=>{const d=x.dept||'未分類'; dm[d]=dm[d]||{n:0,done:0,td:0,tn:0}; dm[d].n++; if(statusOf(x)==='done')dm[d].done++; const p=prog(x); dm[d].td+=p.d; dm[d].tn+=p.n;});
  $('#depts').innerHTML=Object.keys(dm).map(d=>{const v=dm[d],p=v.tn?Math.round(v.td/v.tn*100):0;
    return `<button class="dept ${S.f.dept===d?'on':''}" data-d="${esc(d)}"><div class="top">${esc(d)}<span>${v.done}/${v.n} 完成</span></div><div class="meter" aria-label="${p}%"><i style="width:${p}%"></i></div></button>`}).join('');
  $('#depts').querySelectorAll('.dept').forEach(b=>b.onclick=()=>{S.f.dept=S.f.dept===b.dataset.d?'':b.dataset.d; $('#fd').value=S.f.dept; renderSummary(); renderView();});
}

function filtered(){
  const terms=searchTerms(S.f.q); const sc=new Map();
  let r=S.items.filter(x=>{
    if(S.f.dept&&(x.dept||'未分類')!==S.f.dept) return false;
    if(S.f.source&&x.source!==S.f.source) return false;
    const s=S.f.status;
    if(s==='overdue'&&!isOverdue(x)) return false;
    if(s==='soon'&&!isSoon(x)) return false;
    if(s==='tune'&&!(x.tuneStart||x.tuneEnd)) return false;
    if(['todo','doing','done'].includes(s)&&statusOf(x)!==s) return false;
    if(terms.length){ const v=scoreItem(x,terms); if(!v) return false; sc.set(x.id,v); }
    return true;
  });
  if(terms.length){ // 有強相關結果時，隱藏只是零散字元相符的結果
    const best=Math.max(0,...sc.values()); if(best>=30) r=r.filter(x=>sc.get(x.id)>=25);
  }
  const byRel=terms.length&&S.sort==='id'&&S.dir>0; // 搜尋時預設依相符程度
  return r.sort((a,b)=>byRel&&sc.get(b.id)!==sc.get(a.id)?sc.get(b.id)-sc.get(a.id):cmpBy(a,b,S.sort,S.dir));
}
const SORTS=[['id','編號'],['status','狀態'],['name','設備名稱'],['dept','部門 / 站別'],['vendor','廠商'],['qty','數量'],['eta','預計交機日'],['tune','調機日'],['prog','待辦進度'],['files','附件數']];
const idNum=x=>+String(x.id).replace(/\D/g,'')||0;
function sortVal(x,k){
  switch(k){
    case 'id': return idNum(x);
    case 'status': return isOverdue(x)?0:{todo:1,doing:2,done:3}[statusOf(x)];
    case 'name': return x.name||null;
    case 'dept': return x.dept?(x.dept+'\u0001'+(x.area||'')):null;
    case 'vendor': return String(x.vendor||'').trim()||null;
    case 'qty': return x.qty===''||x.qty==null||isNaN(+x.qty)?null:+x.qty;
    case 'eta': return x.arrivalDate||x.eta||null;
    case 'tune': return x.tuneStart||x.tuneEnd||null;
    case 'prog': { const p=prog(x); return p.n?p.d/p.n:0; }
    case 'files': return (x.files||[]).length;
  } return idNum(x);
}
function cmpBy(a,b,k,dir){
  const va=sortVal(a,k), vb=sortVal(b,k);
  if(va===null&&vb===null) return idNum(a)-idNum(b);
  if(va===null) return 1; if(vb===null) return -1; // 空白永遠排最後
  const c=typeof va==='number'&&typeof vb==='number'?va-vb:String(va).localeCompare(String(vb),'zh-Hant');
  return c?c*dir:idNum(a)-idNum(b);
}
function setSort(k,dir){
  S.sort=k; S.dir=dir; LS.set('eqt_sort',k); LS.set('eqt_dir',String(dir));
  const so=$('#so'); if(so) so.value=k; const sd=$('#sd'); if(sd) sd.textContent=dir>0?'↑ 小→大':'↓ 大→小';
  renderView();
}

function renderView(){ if(S.view==='vendor') return renderVendors(); const r=filtered(); $('#count').textContent=`顯示 ${r.length} / ${S.items.length} 項${S.f.q.trim()&&r.length?'，依相符程度排序':''}`; S.view==='gantt'?renderGantt(r):renderList(r); }

function etaCell(it){
  if(it.arrivalDate) return `<span class="t-ok">已交機 ${fmtD(it.arrivalDate)}</span>`;
  if(!it.eta) return '<span class="muted">未定</span>';
  const u=until(it.eta);
  if(u<0&&statusOf(it)!=='done') return `<span class="t-bad">${fmtD(it.eta)}<br><small>逾期 ${-u} 天</small></span>`;
  return `<span class="${u<=30?'t-warn':''}">${fmtD(it.eta)}${u<=30?`<br><small>還有 ${u} 天</small>`:''}</span>`;
}
function renderList(r){
  const v=$('#view');
  if(!r.length){
    const sg=S.f.q.trim()?suggest(S.f.q,6):[];
    v.innerHTML=`<div class="list"><div class="empty">沒有符合條件的設備。${S.f.dept||S.f.status||S.f.source?'也可以先把部門、狀態、來源改回「全部」再搜尋。':''}
      ${sg.length?`<div style="margin-top:14px">你要找的是不是：</div><div class="sugg">${sg.map(it=>`<button class="btn sm" data-sg="${esc(it.id)}">${esc(it.name)}<span class="muted">${esc(it.spec?' · '+it.spec:'')}</span></button>`).join('')}</div>`:''}</div></div>`;
    v.querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>openItem(b.dataset.sg));
    return;
  }
  v.innerHTML=`<div class="gantt-tools list-tools" style="margin-bottom:10px"><button class="btn" id="xlsL" type="button">匯出 Excel（設備清單＋水電氣統計）</button><span class="g-note">依目前的篩選匯出 ${r.length} 項</span></div><div class="list" role="table">
    <div class="row head" role="row">${[['id','編號',''],['status','狀態',''],['name','設備 / 規格',''],['dept','部門 / 站別',''],['vendor','廠商',''],['qty','數量','c-qty'],['eta','預計交機',''],['prog','待辦進度',''],['files','附件','c-files']].map(([k,l,c])=>{const on=S.sort===k;
      return `<button class="sh ${c} ${on?'on':''}" data-sort="${k}" aria-label="依${l}排序${on?(S.dir>0?'，目前小到大':'，目前大到小'):''}">${l}<i>${on&&S.dir<0?'▼':'▲'}</i></button>`}).join('')}</div>
    ${r.map(it=>{const p=prog(it),pc=p.n?Math.round(p.d/p.n*100):0;
      return `<div class="row" role="row" tabindex="0" data-id="${esc(it.id)}">
        <span class="c-id mono">${esc(it.id)}</span>
        <span class="c-st">${chip(it)}</span>
        <span class="c-name"><b>${hl(it.name,S.f.q)}</b><small>${hl(it.spec||it.nameEn||'',S.f.q)}</small>${(()=>{const f=(it.todos||[]).find(t=>!t.done&&t.note);return f?`<span class="c-flag" title="${esc(f.t+'：'+f.note)}">⚠ ${esc(f.t)}：${hl(f.note,S.f.q)}</span>`:''})()}</span>
        <span class="c-dept"><span>${esc(it.dept)}</span><span class="c-sub">${esc(it.area)}</span></span>
        <span class="c-vendor"><span>${esc(it.vendor||'—')}</span><span class="c-sub">${esc(it.source)}</span></span>
        <span class="c-qty mono">${esc(it.qty)} <small class="muted">${esc(it.unit)}</small></span>
        <span class="c-eta">${etaCell(it)}</span>
        <span class="c-prog"><div class="meter"><i style="width:${pc}%"></i></div><span>${p.d}/${p.n}</span></span>
        <span class="c-files mono">${(it.files||[]).length||'—'}</span>
      </div>`}).join('')}
  </div>`;
  $('#xlsL').onclick=()=>runExport($('#xlsL'),'exportList',r,'Equipment_List_','.list-tools');
  v.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{ const k=b.dataset.sort; setSort(k, S.sort===k?-S.dir:1); });
  v.querySelectorAll('.row[data-id]').forEach(el=>{ el.onclick=()=>openItem(el.dataset.id); el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openItem(el.dataset.id)}}; });
}

/* ---------- Gantt ---------- */
function renderGantt(r){
  const v=$('#view');
  const rows=r.filter(x=>x.poDate||x.eta||x.arrivalDate||x.tuneStart||x.tuneEnd);
  const missing=r.length-rows.length;
  const pxd={day:26,week:9,month:3.2}[S.zoom]||9;
  const tools=`<div class="gantt-tools">
     <div class="seg"><button data-z="day" class="${S.zoom==='day'?'on':''}">日</button><button data-z="week" class="${S.zoom==='week'?'on':''}">週</button><button data-z="month" class="${S.zoom==='month'?'on':''}">月</button></div>
     <button class="btn" id="xls">匯出 Excel</button>
     <div class="legend"><span><i style="background:var(--po)"></i>下單 → 交機</span><span><i style="background:var(--accent)"></i>預計交機</span><span><i style="background:var(--ok)"></i>實際交機</span><span><i style="background:var(--tune)"></i>調機期間</span><span><i style="background:var(--bad);width:2px"></i>今天</span></div>
   </div>`;
  if(!rows.length){
    v.innerHTML=tools+`<div class="gantt" style="margin-top:10px"><div class="empty">篩選結果裡還沒有設備填寫日期。<br>打開設備，在「交期與調機」填寫下單日、預計交機日、調機開始 / 完成日，就會出現在甘特圖上。</div></div>`;
    bindGanttTools(r); return;
  }
  let min=null,max=null; const t0=pd(today());
  rows.forEach(x=>['poDate','eta','arrivalDate','tuneStart','tuneEnd'].forEach(k=>{const d=pd(x[k]); if(!d)return; if(!min||d<min)min=d; if(!max||d>max)max=d;}));
  if(t0<min) min=t0; if(t0>max) max=t0;
  min=new Date(min.getFullYear(),min.getMonth(),1); max=new Date(max.getFullYear(),max.getMonth()+1,0);
  const total=days(min,max)+1, W=Math.round(total*pxd), X=d=>Math.round(days(min,d)*pxd);
  // header ticks
  let head='',grid='';
  for(let d=new Date(min);d<=max;d.setMonth(d.getMonth()+1)){
    const x=X(d); head+=`<div class="g-month" style="left:${x}px">${d.getFullYear()}/${pad(d.getMonth()+1)}</div><div class="g-tick m" style="left:${x}px"></div>`;
    grid+=`<div class="g-tick m" style="left:${x}px"></div>`;
  }
  if(S.zoom!=='month'){
    for(let d=new Date(min);d<=max;d.setDate(d.getDate()+1)){
      const wd=d.getDay(), x=X(d);
      if(S.zoom==='day'){ head+=`<div class="g-tick" style="left:${x}px">${d.getDate()}</div>`; if(wd===1&&d.getDate()!==1) grid+=`<div class="g-wk" style="left:${x}px"></div>`; }
      else if(wd===1&&d.getDate()!==1){ head+=`<div class="g-tick" style="left:${x}px">${d.getDate()}</div>`; grid+=`<div class="g-wk" style="left:${x}px"></div>`; }
    }
  }
  const tx=X(t0)+Math.round(pxd/2);
  const nameW=window.innerWidth<720?132:240;

function numOrBlank(v){ if(v===''||v==null) return ''; const n=Number(String(v).replace(/,/g,'')); return isNaN(n)?String(v):n; }

function saveDraft(silent){ const run=()=>_saveDraft(silent); S.saveQ=(S.saveQ||Promise.resolve()).then(run,run); return S.saveQ; }
async function _saveDraft(silent){
  const d=S.draft; if(!d) return; const rev=S.rev||0;
  if(!String(d.name||'').trim()){ toast('請先填寫設備名稱。',true); const f=$('#f_name'); if(f) f.focus(); return; }
  const out={}; Object.keys(d).forEach(k=>{ if(!['files','folderId','updatedAt'].includes(k)) out[k]=d[k]; });
  ['qty','unitPrice','totalPrice'].forEach(k=>out[k]=numOrBlank(out[k]));
  S.saving=true; renderFoot();
  try{
    const saved=await authed('saveItem',out);
    const i=S.items.findIndex(x=>x.id===saved.id);
    if(i>=0) S.items[i]=saved; else S.items.push(saved);
    const wasNew=!d.id;
    if(S.draft===d){ d.id=saved.id; d.updatedAt=saved.updatedAt; if((S.rev||0)===rev) S.dirty=false; }
    S.saving=false;
    if($('#drawer')&&S.draft===d){ if(wasNew){ const sc=$('#dbody').scrollTop; renderDrawer(); $('#dbody').scrollTop=sc; } else { renderFoot(); const sub=$('.d-head .sub'); if(sub) sub.innerHTML=`<span class="mono">${esc(saved.id)}</span>${chip(saved)}<span>更新於 ${esc(saved.updatedAt||'')}</span>`; } }
    renderSummary(); renderView();
    if(!silent){ toast('已儲存'); if(!wasNew&&S.draft===d) maybeSync(d); else S.orig=clone(d); }
    return saved;
  }catch(e){ S.saving=false; renderFoot(); toast('儲存失敗：'+msg(e),true); }
}

const FIELD_LABEL={}; FORM.forEach(sec=>sec.f.forEach(f=>FIELD_LABEL[f[0]]=f[1]));

const show=v=>v===''||v==null?'（空白）':String(v);

function todoDiff(o,d){
  const A=o.todos||[], B=d.todos||[], byA={}, byB={}; A.forEach(t=>byA[t.t]=t); B.forEach(t=>byB[t.t]=t);
  const ch=[];
  B.forEach((t,i)=>{ const a=byA[t.t];
    if(!a){ ch.push({kind:'add',label:`新增待辦「${t.t}」`,op:{t:t.t,after:i?B[i-1].t:'',done:!!t.done,at:t.at||'',note:t.note||''}}); return; }
    if(!!a.done!==!!t.done) ch.push({kind:'set',label:`${t.done?'勾選完成':'取消勾選'}「${t.t}」`,op:{t:t.t,done:!!t.done,at:t.at||''}});
    if((a.note||'')!==(t.note||'')) ch.push({kind:'note',label:t.note?`「${t.t}」備註：${t.note}`:`清除「${t.t}」的備註`,op:{t:t.t,note:t.note||''}});
  });
  A.forEach(a=>{ if(!byB[a.t]) ch.push({kind:'remove',label:`刪除待辦「${a.t}」`,op:a.t}); });
  const cB=B.filter(t=>byA[t.t]).map(t=>t.t), cA=A.filter(t=>byB[t.t]).map(t=>t.t);
  if(cB.join('\u0001')!==cA.join('\u0001')) ch.push({kind:'order',label:'調整待辦順序（照這台的順序排）',op:B.map(t=>t.t)});
  return ch;
}
// 與後端 applyTodoOps_ 相同：舊版後端時在瀏覽器套用
function applyTodoOps(todos,ops){
  let ts=todos.map(t=>Object.assign({},t)); const find=n=>ts.find(t=>t.t===n);
  (ops.remove||[]).forEach(n=>{ ts=ts.filter(t=>t.t!==n); });
  (ops.add||[]).forEach(a=>{ if(find(a.t)) return; const i=a.after?ts.findIndex(t=>t.t===a.after):-1; ts.splice(i+1,0,{t:a.t,done:!!a.done,at:a.at||'',note:a.note||''}); });
  (ops.set||[]).forEach(o=>{ const t=find(o.t); if(t){ t.done=!!o.done; t.at=o.at||''; } });
  (ops.note||[]).forEach(o=>{ const t=find(o.t); if(t) t.note=o.note||''; });
  if(ops.order&&ops.order.length){ const pos={}; ops.order.forEach((n,i)=>pos[n]=i); ts=ts.map((t,i)=>({t,i})).sort((a,b)=>((a.t.t in pos)?pos[a.t.t]:1e6+a.i)-((b.t.t in pos)?pos[b.t.t]:1e6+b.i)).map(x=>x.t); }
  return ts;
}
function syncPlan(d){
  const o=S.orig; if(!o||!d.id) return null;
  const same=(a,b)=>String(a==null?'':a).trim()===String(b==null?'':b).trim();
  const changed=SYNC_KEYS.filter(k=>!same(o[k],d[k]));
  const tch=todoDiff(o,d);
  const key=norm(o.name);
  const matches=S.items.filter(x=>x.id!==d.id&&key&&(norm(x.name)===key||norm(x.name)===norm(d.name)));
  if((!changed.length&&!tch.length)||!matches.length) return null;
  return {changed,tch,matches};
}
function maybeSync(d,after){
  const plan=syncPlan(d);
  if(!plan){ S.orig=clone(d); if(after) after(); return; }
  showSync(d,S.orig,plan,after);
}
function showSync(d,o,plan,after){
  const {changed,tch,matches}=plan;
  closeModal();
  const sc=document.createElement('div'); sc.className='mscrim';
  const m=document.createElement('div'); m.className='modal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true'); m.setAttribute('aria-labelledby','mh');
  m.innerHTML=`<div class="m-body">
      <h2 id="mh">要同步到其他「${esc(o.name)}」嗎？</h2>
      <p>還有 ${matches.length} 項設備也叫「${esc(o.name)}」。勾選要同步的內容和設備，沒勾的不會改。</p>
      ${changed.length?`<h3>你改了這些欄位</h3>
      ${changed.map(k=>`<label class="ck"><input type="checkbox" data-sf="${k}" checked><span class="cb"><b>${esc(FIELD_LABEL[k])}</b><span><s>${esc(show(o[k]))}</s> → ${esc(show(d[k]))}</span></span></label>`).join('')}`:''}
      ${tch.length?`<h3>待辦事項的變更</h3>
      ${tch.map((c,i)=>`<label class="ck"><input type="checkbox" data-st="${i}" checked><span class="cb"><b>${esc(c.label)}</b></span></label>`).join('')}`:''}
      <h3>同名設備（${matches.length} 項）<button class="btn sm" type="button" id="sall">全選</button><button class="btn sm" type="button" id="snone">全不選</button></h3>
      ${matches.map(x=>{const diff=changed.filter(k=>String(x[k]==null?'':x[k]).trim()!==String(d[k]==null?'':d[k]).trim()); const p=prog(x);
        return `<label class="ck"><input type="checkbox" data-si="${esc(x.id)}" checked><span class="cb"><span><span class="mono">${esc(x.id)}</span> · ${esc(x.dept)}${x.area?' · '+esc(x.area):''}</span>
          <small>${esc([x.spec,x.vendor,x.qty!==''&&x.qty!=null?x.qty+(x.unit||''):''].filter(Boolean).join(' · ')||'—')} · 待辦 ${p.d}/${p.n}</small>
          ${changed.length?`<small>${diff.length?'目前：'+diff.map(k=>esc(FIELD_LABEL[k])+' '+esc(show(x[k]))).join('；'):'這些欄位已經一樣'}</small>`:''}</span></label>`}).join('')}
    </div>
    <div class="m-foot"><button class="btn" type="button" id="sskip">不同步</button><button class="btn primary" type="button" id="sgo"></button></div>`;
  document.body.append(sc,m);
  const upd=()=>{ const n=m.querySelectorAll('[data-si]:checked').length, f=m.querySelectorAll('[data-sf]:checked,[data-st]:checked').length; const b=$('#sgo'); b.textContent=n&&f?`同步到勾選的 ${n} 項`:'請至少勾選一項內容和一項設備'; b.disabled=!(n&&f); };
  m.querySelectorAll('input').forEach(i=>i.onchange=upd); upd();
  $('#sall').onclick=()=>{ m.querySelectorAll('[data-si]').forEach(i=>i.checked=true); upd(); };
  $('#snone').onclick=()=>{ m.querySelectorAll('[data-si]').forEach(i=>i.checked=false); upd(); };
  const finish=()=>{ S.orig=clone(d); closeModal(); if(after) after(); };
  sc.onclick=finish; $('#sskip').onclick=finish;
  $('#sgo').onclick=async()=>{
    const ids=[...m.querySelectorAll('[data-si]:checked')].map(i=>i.dataset.si);
    const fields={}; [...m.querySelectorAll('[data-sf]:checked')].forEach(i=>{ const k=i.dataset.sf; fields[k]=['qty','unitPrice','totalPrice'].includes(k)?numOrBlank(d[k]):d[k]; });
    const sel=[...m.querySelectorAll('[data-st]:checked')].map(i=>tch[+i.dataset.st]);
    if(sel.length){ const ops={set:[],note:[],add:[],remove:[],order:[]}; sel.forEach(c=>{ if(c.kind==='order') ops.order=c.op; else ops[c.kind].push(c.op); }); fields.todoOps=ops; }
    const b=$('#sgo'); b.disabled=true; b.textContent='同步中…';
    try{
      let updated;
      try{ updated=await authed('bulkUpdate',ids,fields); }
      catch(e){ if(!/未知的操作|bulkUpdate/.test(msg(e))) throw e; // 舊版後端：逐筆存檔
        updated=[]; for(const id of ids){ const it=S.items.find(x=>x.id===id); const o2={}; Object.keys(it).forEach(k=>{ if(!['files','folderId','updatedAt'].includes(k)) o2[k]=it[k]; });
          Object.keys(fields).forEach(k=>{ if(k!=='todoOps') o2[k]=fields[k]; }); if(fields.todoOps) o2.todos=applyTodoOps(it.todos||[],fields.todoOps); updated.push(await authed('saveItem',o2)); } }
      (updated||[]).forEach(u=>{ const i=S.items.findIndex(x=>x.id===u.id); if(i>=0) S.items[i]=u; });
      renderSummary(); renderView(); toast(`已同步 ${ids.length} 項設備`); finish();
    }catch(e){ toast('同步失敗：'+msg(e),true); upd(); }
  };
  setTimeout(()=>$('#sgo')&&$('#sgo').focus(),30);
}

/* ---------- 廠商通訊錄 ---------- */
const vkey=n=>String(n||'').trim();
function vendorText(name){ const v=S.vendors[vkey(name)]; if(!v) return ''; return (v.contacts||[]).map(c=>[c.name,c.role,c.phone,c.chat,c.email].join(' ')).join(' ')+' '+(v.note||''); }
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast('已複製'); }
  catch(e){ const a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); let ok=false; try{ok=document.execCommand('copy')}catch(x){} a.remove(); toast(ok?'已複製':'無法自動複製，請長按文字手動複製', !ok); }
}
function contactsHTML(v){
  const cs=(v&&v.contacts)||[];
  if(!cs.length&&!(v&&v.note)) return '<div class="muted" style="font-size:13px">還沒有聯絡資訊</div>';
  return `<div class="contacts">${cs.map(c=>`<div class="contact">
      ${c.name||c.role?`<div class="who">${esc(c.name||'（未填姓名）')}${c.role?`<span>${esc(c.role)}</span>`:''}</div>`:''}
      ${c.phone?`<div class="cl"><em>電話</em><a href="tel:${esc(c.phone.replace(/[^\d+]/g,''))}">${esc(c.phone)}</a><button class="cp" data-copy="${esc(c.phone)}">複製</button></div>`:''}
      ${c.chat?`<div class="cl"><em>微信/群組</em><span>${esc(c.chat)}</span><button class="cp" data-copy="${esc(c.chat)}">複製</button></div>`:''}
      ${c.email?`<div class="cl"><em>Email</em><a href="mailto:${esc(c.email)}">${esc(c.email)}</a><button class="cp" data-copy="${esc(c.email)}">複製</button></div>`:''}
    </div>`).join('')}</div>${v&&v.note?`<div class="vnote">${esc(v.note)}</div>`:''}`;
}
function bindCopy(root){ root.querySelectorAll('[data-copy]').forEach(b=>b.onclick=e=>{e.preventDefault(); copyText(b.dataset.copy);}); }
// 顯示／編輯某家廠商的聯絡資訊；getName 回傳目前的廠商名稱
function renderVendorBox(box,getName,startEdit){
  if(!box) return; const name=vkey(getName()); const v=S.vendors[name];
  if(!name){ box.innerHTML='<div class="vbox-h">廠商聯絡資訊</div><div class="muted" style="font-size:13px">先填寫「設備廠商 / 品牌」，就能加聯絡人。</div>'; return; }
  if(startEdit&&!S.vEdit) S.vEdit={name,contacts:clone((v&&v.contacts)||[]),note:(v&&v.note)||''};
  if(S.vEdit&&S.vEdit.name===name){
    const e=S.vEdit; if(!e.contacts.length) e.contacts.push({name:'',role:'',phone:'',chat:'',email:''});
    box.innerHTML=`<div class="vbox-h">編輯「${esc(name)}」的聯絡資訊<span>同一家廠商的所有設備共用</span></div>
      ${e.contacts.map((c,i)=>`<div class="cedit">
        <div><label class="lab" for="vc_n${i}">聯絡人</label><input class="inp" id="vc_n${i}" data-ci="${i}" data-cf="name" value="${esc(c.name)}" placeholder="例如：王經理"></div>
        <div><label class="lab" for="vc_r${i}">職稱 / 負責</label><input class="inp" id="vc_r${i}" data-ci="${i}" data-cf="role" value="${esc(c.role)}" placeholder="例如：業務、售後"></div>
        <div><label class="lab" for="vc_p${i}">電話</label><input class="inp" id="vc_p${i}" data-ci="${i}" data-cf="phone" value="${esc(c.phone)}" inputmode="tel" placeholder="+86 138…"></div>
        <div><label class="lab" for="vc_c${i}">微信 / LINE / 群組</label><input class="inp" id="vc_c${i}" data-ci="${i}" data-cf="chat" value="${esc(c.chat)}" placeholder="例如：微信群「泰國新廠-砺宏」"></div>
        <div class="full"><label class="lab" for="vc_e${i}">Email</label><input class="inp" id="vc_e${i}" data-ci="${i}" data-cf="email" value="${esc(c.email)}" inputmode="email"></div>
        ${e.contacts.length>1?`<button class="btn sm ghost rm" data-crm="${i}" aria-label="移除這位聯絡人">移除</button>`:''}
      </div>`).join('')}
      <button class="btn sm" id="vcadd" type="button">＋ 再加一位聯絡人</button>
      <div><label class="lab" for="vc_note">廠商備註（地址、付款條件、交貨方式…）</label><textarea class="inp" id="vc_note">${esc(e.note)}</textarea></div>
      <div class="vactions"><button class="btn primary" id="vcsave" type="button">儲存聯絡資訊</button><button class="btn" id="vccancel" type="button">取消</button></div>`;
    box.querySelectorAll('[data-ci]').forEach(inp=>inp.oninput=()=>{ e.contacts[+inp.dataset.ci][inp.dataset.cf]=inp.value; });
    $('#vc_note').oninput=ev=>{ e.note=ev.target.value; };
    box.querySelectorAll('[data-crm]').forEach(b=>b.onclick=()=>{ e.contacts.splice(+b.dataset.crm,1); renderVendorBox(box,getName); });
    $('#vcadd').onclick=()=>{ e.contacts.push({name:'',role:'',phone:'',chat:'',email:''}); renderVendorBox(box,getName); const l=box.querySelectorAll('[data-cf="name"]'); l[l.length-1].focus(); };
    $('#vccancel').onclick=()=>{ S.vEdit=null; renderVendorBox(box,getName); };
    $('#vcsave').onclick=async()=>{
      const b=$('#vcsave'); b.disabled=true; b.textContent='儲存中…';
      try{ const saved=await authed('saveVendor',{name,contacts:e.contacts,note:e.note}); S.vendors[saved.name]=saved; S.vEdit=null; renderVendorBox(box,getName); toast('聯絡資訊已儲存'); if(S.view==='vendor') renderView(); }
      catch(err){ toast('儲存失敗：'+msg(err),true); b.disabled=false; b.textContent='儲存聯絡資訊'; }
    };
    return;
  }
  box.innerHTML=`<div class="vbox-h">「${esc(name)}」聯絡資訊<button class="btn sm" id="vcedit" type="button">${v&&(v.contacts||[]).length?'編輯':'＋ 新增聯絡人'}</button></div>${contactsHTML(v)}`;
  bindCopy(box);
  $('#vcedit').onclick=()=>{ S.vEdit=null; renderVendorBox(box,getName,true); const f=box.querySelector('[data-cf="name"]'); if(f) f.focus(); };
}
function vendorGroups(){
  const base=S.items.filter(x=>{ if(S.f.dept&&(x.dept||'未分類')!==S.f.dept) return false; if(S.f.source&&x.source!==S.f.source) return false; return true; });
  const g={}; base.forEach(it=>{ const k=vkey(it.vendor); if(!k) return; (g[k]=g[k]||[]).push(it); });
  if(!S.f.dept&&!S.f.source) Object.keys(S.vendors).forEach(k=>{ g[k]=g[k]||[]; });
  return g;
}
function renderVendors(){
  const v=$('#view'), g=vendorGroups(), terms=searchTerms(S.f.q);
  let names=Object.keys(g);
  const sc={};
  if(terms.length){ names=names.filter(n=>{ const nm=norm(n), all=norm(n+' '+vendorText(n)+' '+g[n].map(i=>i.name+' '+i.spec).join(' ')); let s=0; for(const t of terms){ const x=termScore(t,nm,all); if(!x) return false; s+=x; } sc[n]=s; return true; }); }
  names.sort((a,b)=>terms.length&&sc[b]!==sc[a]?sc[b]-sc[a]:((S.vendors[b]?1:0)-(S.vendors[a]?1:0))||g[b].length-g[a].length||a.localeCompare(b,'zh-Hant'));
  const filled=names.filter(n=>S.vendors[n]&&(S.vendors[n].contacts||[]).length).length;
  $('#count').textContent=`${names.length} 家廠商，${filled} 家已填聯絡資訊`;
  if(!names.length){ v.innerHTML='<div class="list"><div class="empty">沒有符合條件的廠商。</div></div>'; return; }
  v.innerHTML=`<div class="vgrid">${names.map(n=>{const its=g[n], vd=S.vendors[n];
    return `<article class="vcard"><div class="vcard-h"><div><b>${hl(n,S.f.q)}</b><br><small>${its.length} 項設備</small></div><button class="btn sm" data-vopen="${esc(n)}">${vd&&(vd.contacts||[]).length?'查看 / 編輯':'＋ 聯絡人'}</button></div>
      ${vd?contactsHTML(vd):''}
      ${its.length?`<div class="vitems">${esc(its.map(i=>i.name).filter((x,i,a)=>a.indexOf(x)===i).join('、'))}</div>`:''}</article>`}).join('')}</div>`;
  bindCopy(v);
  v.querySelectorAll('[data-vopen]').forEach(b=>b.onclick=()=>openVendor(b.dataset.vopen));
}
function openVendor(name){
  closeDrawer(true); S.draft=null; S.dirty=false; S.vEdit=null;
  const sc=document.createElement('div'); sc.className='scrim'; sc.id='scrim'; sc.onclick=()=>closeDrawer();
  const d=document.createElement('aside'); d.className='drawer'; d.id='drawer'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true');
  document.body.append(sc,d); document.body.style.overflow='hidden';
  const its=S.items.filter(i=>vkey(i.vendor)===name);
  d.innerHTML=`<div class="d-head"><div class="t"><h2>${esc(name)}</h2><div class="sub">廠商 · ${its.length} 項設備</div></div><button class="btn ghost" id="dclose" aria-label="關閉">✕</button></div>
    <div class="d-body" id="dbody"><section class="sec"><div class="vbox" id="vbox2" style="margin:0;padding:0;border:0"></div></section>
      ${its.length?`<section class="sec"><h3>這家廠商的設備</h3><div class="vlist">${its.map(i=>`<button data-oi="${esc(i.id)}"><span><b style="font-weight:500">${esc(i.name)}</b> <span class="muted">${esc(i.spec||'')}</span></span><span>${chip(i)}</span></button>`).join('')}</div></section>`:''}
    </div><div class="d-foot"><span class="sp"></span><button class="btn" id="dcancel">關閉</button></div>`;
  $('#dclose').onclick=()=>closeDrawer(); $('#dcancel').onclick=()=>closeDrawer();
  const has=S.vendors[name]&&(S.vendors[name].contacts||[]).length;
  renderVendorBox($('#vbox2'),()=>name,!has);
  d.querySelectorAll('[data-oi]').forEach(b=>b.onclick=()=>openItem(b.dataset.oi));
}

/* ---------- files ---------- */
function renderFiles(){
  const box=$('#files'); if(!box) return; const fs=S.draft.files||[];
  box.innerHTML=fs.map(f=>`<div class="file"><div class="nm">${f.url?`<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>`:`<span>${esc(f.name)}</span>`}<small>${esc(f.date||'')} · ${fsize(f.size)}</small></div>
     <button class="btn sm danger ${S.arm==='f'+f.id?'armed':''}" data-fid="${esc(f.id)}">${S.arm==='f'+f.id?'確定刪除':'刪除'}</button></div>`).join('')
   + S.uploading.map(n=>`<div class="file up"><div class="nm"><span>${esc(n)}</span></div></div>`).join('')
   + (!fs.length&&!S.uploading.length?'<div class="muted" style="padding-top:4px">還沒有附件</div>':'');
  box.querySelectorAll('[data-fid]').forEach(b=>b.onclick=async()=>{
    const fid=b.dataset.fid;
    if(S.arm!=='f'+fid){ S.arm='f'+fid; renderFiles(); setTimeout(()=>{if(S.arm==='f'+fid){S.arm=null;renderFiles()}},4000); return; }
    S.arm=null; b.disabled=true;
    try{ applyFiles(await authed('deleteFile',S.draft.id,fid)); toast('檔案已移到雲端硬碟垃圾桶'); }catch(e){ toast(msg(e),true); renderFiles(); }
  });
}
function applyFiles(r){
  const id=S.draft.id; S.draft.files=r.files; if(r.folderId) S.draft.folderId=r.folderId;
  const it=S.items.find(x=>x.id===id); if(it){ it.files=r.files; if(r.folderId) it.folderId=r.folderId; }
  if(r.folderId&&!$('.sec h3 a')){ const sc=$('#dbody').scrollTop; const dirty=S.dirty; renderDrawer(); S.dirty=dirty; renderFoot(); $('#dbody').scrollTop=sc; } else renderFiles();
  renderView();
}
const toB64=f=>new Promise((res,rej)=>{const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=()=>rej(new Error('讀取檔案失敗')); r.readAsDataURL(f);});
async function uploadFiles(list){
  if(!S.draft) return;
  if(!S.draft.id){ const s=await saveDraft(true); if(!s) return; }
  for(const f of list){
    if(f.size>MAXB){ toast(`「${f.name}」超過 25 MB，請直接放進雲端資料夾。`,true); continue; }
    S.uploading.push(f.name); renderFiles();
    try{ const b64=GAS?await toB64(f):''; applyFiles(await authed('uploadFile',S.draft.id,f.name,f.type||'',b64,f.size)); toast(`已上傳「${f.name}」`); }
    catch(e){ toast(`「${f.name}」上傳失敗：${msg(e)}`,true); }
    finally{ S.uploading.splice(S.uploading.indexOf(f.name),1); renderFiles(); }
  }
}
$('#filepick').addEventListener('change',e=>{ const l=[...e.target.files]; e.target.value=''; if(l.length) uploadFiles(l); });

window.addEventListener('resize',()=>{ if(S.view==='gantt'&&$('.gantt')){ clearTimeout(window._rz); window._rz=setTimeout(renderView,200);} });
boot();
})();
